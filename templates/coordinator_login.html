<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Login - Omni Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fefce8; border: 2px solid #fef08a; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.1); }
        h2 { text-align: center; color: #0f172a; margin-bottom: 8px; font-weight: 700; }
        p.sub { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 20px; }
        .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 0.88rem; text-align: center; font-weight: 600; }
        .alert-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        input:focus { border-color: #eab308; outline: none; }
        .btn { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        .btn:hover { background: #eab308; color: #0f172a; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .back-link:hover { color: #ca8a04; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Coordinator Login</h2>
        <p class="sub">Department Representatives & Club Coordinators Portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/coordinator_login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Login & Post Event</button>
        </form>
        <a href="/login_portal" class="back-link">← Back to Portal</a>
    </div>
</body>
</html>
