<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Club' if mode == 'edit' else 'Add New Club' }} - Omni Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border: 2px solid #fef08a; border-radius: 20px; padding: 35px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.1); }
        h2 { text-align: center; color: #0f172a; margin-bottom: 20px; font-weight: 700; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; }
        input:focus { border-color: #eab308; outline: none; box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15); }
        .btn { width: 100%; padding: 13px; background: #0f172a; color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #eab308; color: #0f172a; }
        .back-link { display: block; text-align: center; margin-top: 18px; color: #64748b; text-decoration: none; font-size: 0.88rem; font-weight: 600; }
        .back-link:hover { color: #ca8a04; }
    </style>
</head>
<body>
    <div class="card">
        <h2><i class="fa-solid fa-layer-group" style="color: #eab308;"></i> {{ 'Edit Club Name' if mode == 'edit' else 'Add New Club' }}</h2>

        <form action="{{ url_for('edit_club', club_id=club.id) if mode == 'edit' else url_for('add_club') }}" method="POST">
            <div class="form-group">
                <label>Club Name *</label>
                <input type="text" name="club_name" value="{{ club.club_name if mode == 'edit' else '' }}" required placeholder="e.g. Robotics Club">
            </div>
            <button type="submit" class="btn">
                <i class="fa-solid fa-floppy-disk"></i> {{ 'Update Club Name' if mode == 'edit' else 'Save Club' }}
            </button>
        </form>

        <a href="/admin_clubs" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Admin Club Management</a>
    </div>
</body>
</html>
