<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal Workspace - Omni Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; border: 2px solid #fef08a; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.1); }
        .icon-box { font-size: 3rem; color: #eab308; margin-bottom: 15px; }
        h2 { font-size: 1.8rem; color: #0f172a; margin-bottom: 8px; font-weight: 700; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .btn { display: inline-block; width: 100%; padding: 13px; background: #0f172a; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 700; transition: all 0.2s; }
        .btn:hover { background: #eab308; color: #0f172a; }
        .back-link { display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.88rem; font-weight: 600; }
        .back-link:hover { color: #ca8a04; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box"><i class="fa-solid fa-user-graduate"></i></div>
        <h2>Student Portal</h2>
        <p>Access active campus events feed and register your participation.</p>
        <a href="/student_login" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Student Login</a>
        <br>
        <a href="/login_portal" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal Selection</a>
    </div>
</body>
</html>
