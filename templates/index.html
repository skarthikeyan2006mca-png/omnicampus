<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Campus - Hero Landing Page</title>
    <!-- Google Fonts: Poppins & Sedgwick Ave -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&family=Sedgwick+Ave&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Hero Banner Container */
        .hero-banner {
            width: 100%;
            max-width: 1100px;
            background: linear-gradient(135deg, #ffc107 0%, #ffb703 60%, #ffa000 100%);
            border-radius: 28px;
            padding: 60px 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(255, 160, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 380px;
        }

        /* Subtle Background Pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.08;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* Left Content Section */
        .hero-left {
            z-index: 2;
        }

        .sub-tag {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            margin-bottom: -10px;
            letter-spacing: -0.5px;
        }

        /* Brand Title Wrapper */
        .brand-title-wrap {
            position: relative;
            display: inline-block;
        }

        .brand-title {
            display: flex;
            align-items: baseline;
        }

        .omni-text {
            color: #000000;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
        }

        .campus-text {
            color: #15803d; /* Dark Green */
            font-family: 'Sedgwick Ave', cursive;
            font-size: 6rem;
            margin-left: 10px;
            transform: rotate(-3deg);
            display: inline-block;
            line-height: 0.8;
            filter: drop-shadow(0px 2px 4px rgba(255, 255, 255, 0.4));
        }

        /* Green Swoop Underline SVG */
        .swoop-container {
            position: absolute;
            bottom: -15px;
            left: 10px;
            width: 300px;
            height: 40px;
        }

        /* Right Section - Welcome Button in Right Corner */
        .hero-right {
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* Welcome Button */
        .welcome-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 20px 48px;
            background-color: #000000;
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .welcome-btn:hover {
            background-color: #15803d;
            color: #ffffff;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(21, 128, 61, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 868px) {
            .hero-banner {
                flex-direction: column;
                text-align: center;
                padding: 50px 30px;
                gap: 40px;
            }
            .brand-title {
                justify-content: center;
            }
            .hero-right {
                justify-content: center;
                width: 100%;
            }
        }

        @media (max-width: 576px) {
            .omni-text { font-size: 3.8rem; }
            .campus-text { font-size: 4.2rem; }
            .sub-tag { font-size: 1.6rem; }
            .welcome-btn { padding: 16px 36px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Hero Banner Container -->
    <div class="hero-banner">
        <div class="bg-pattern"></div>

        <!-- Left Column: Branding Title -->
        <div class="hero-left">
            <div class="sub-tag">Everything on</div>
            
            <div class="brand-title-wrap">
                <div class="brand-title">
                    <span class="omni-text">omni</span>
                    <span class="campus-text">Campus</span>
                </div>
                <!-- Green Underline Swoop Graphic -->
                <div class="swoop-container">
                    <svg viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 10 20 Q 80 40 140 20 C 180 5 130 35 190 30" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Right Column: Welcome Button on Right Corner -->
        <div class="hero-right">
            <a href="/login" class="welcome-btn">
                Welcome <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>

</body>
</html>
