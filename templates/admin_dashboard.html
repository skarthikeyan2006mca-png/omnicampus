<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Omni Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        h1 { font-size: 1.8rem; color: #0f172a; font-weight: 700; }

        .nav-links { display: flex; gap: 10px; }
        .btn-nav { padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #0f172a; color: #fff; }
        .btn-primary:hover { background: #eab308; color: #0f172a; }
        .btn-outline { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
        .btn-outline:hover { background: #fef08a; border-color: #eab308; }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; font-weight: 600; }
        .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }

        .card { background: #fff; border: 2px solid #fef08a; border-radius: 20px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .card-header { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1.5px solid #fef08a; padding-bottom: 10px; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 0.88rem; color: #334155; margin-bottom: 6px; }
        input, select, textarea { padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.92rem; }
        input:focus, select:focus, textarea:focus { border-color: #eab308; outline: none; }
        
        .btn-submit { grid-column: 1 / -1; padding: 13px; background: #0f172a; color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #eab308; color: #0f172a; }

        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1><i class="fa-solid fa-user-shield" style="color: #eab308;"></i> Admin Dashboard</h1>
            <div class="nav-links">
                <a href="/admin_clubs" class="btn-nav btn-primary"><i class="fa-solid fa-sliders"></i> Manage Clubs</a>
                <a href="/view_students" class="btn-nav btn-outline"><i class="fa-solid fa-users"></i> View Students</a>
                <a href="/logout" class="btn-nav btn-outline"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-user-plus" style="color: #eab308;"></i> Register New Student
            </div>

            <form action="/admin_dashboard" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Register Number *</label>
                        <input type="text" name="register_no" required placeholder="e.g. 231001">
                    </div>
                    <div class="form-group">
                        <label>Student Name *</label>
                        <input type="text" name="name" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label>Gender *</label>
                        <select name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Course / Dept *</label>
                        <input type="text" name="course" required placeholder="e.g. B.Sc Computer Science">
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" name="email" required placeholder="student@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>Student Mobile *</label>
                        <input type="text" name="student_mobile" required placeholder="Phone number">
                    </div>
                    <div class="form-group">
                        <label>Father Name *</label>
                        <input type="text" name="father_name" required placeholder="Father's Name">
                    </div>
                    <div class="form-group">
                        <label>Mother Name *</label>
                        <input type="text" name="mother_name" required placeholder="Mother's Name">
                    </div>
                    <div class="form-group">
                        <label>Parent Mobile *</label>
                        <input type="text" name="parent_mobile" required placeholder="Parent Phone">
                    </div>
                    <div class="form-group">
                        <label>Aadhaar Number *</label>
                        <input type="text" name="aadhaar_no" required placeholder="12-digit Aadhaar">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" name="password" required placeholder="Create Password">
                    </div>
                    <div class="form-group full">
                        <label>Residential Address *</label>
                        <textarea name="address" rows="3" required placeholder="Full Address"></textarea>
                    </div>

                    <button type="submit" class="btn-submit"><i class="fa-solid fa-user-check"></i> Add Student Details</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
