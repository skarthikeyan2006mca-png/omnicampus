<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Omni Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #ffffff; border: 2px solid #fef08a; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.1); }
        h2 { text-align: center; color: #0f172a; margin-bottom: 8px; font-weight: 700; font-size: 1.6rem; }
        p.sub { text-align: center; color: #64748b; font-size: 0.88rem; margin-bottom: 25px; }
        .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.88rem; text-align: center; font-weight: 600; }
        .alert-danger { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 0.88rem; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; }
        input:focus { border-color: #eab308; outline: none; box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15); }
        .btn { width: 100%; padding: 13px; background: #0f172a; color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        .btn:hover { background: #eab308; color: #0f172a; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #64748b; }
        .footer-links a { color: #ca8a04; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.88rem; font-weight: 600; }
        .back-link:hover { color: #ca8a04; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fa-solid fa-user-graduate" style="color: #eab308;"></i> Student Login</h2>
        <p class="sub">Enter your credentials to access events</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/student_login" method="POST">
            <div class="form-group">
                <label>Register Number *</label>
                <input type="text" name="register_no" required placeholder="Enter your Register No">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Login to Feed</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="/student_register">Register Here</a><br>
            <a href="/login_portal" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Portal</a>
        </div>
    </div>
</body>
</html>
